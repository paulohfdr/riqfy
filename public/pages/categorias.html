<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiqFy — Categorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css?v=26">
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div id="topbar-root"></div>
  <div class="content">

    <div class="summary-cards cols-3" style="margin-bottom:20px">
      <div class="summary-card">
        <div class="card-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg></div>
        <div><div class="card-label">Total de categorias</div><div class="card-value" id="cv-total">0</div></div>
      </div>
      <div class="summary-card">
        <div class="card-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></div>
        <div><div class="card-label">Gestão de categorias</div><div class="card-value" style="font-size:14px">Ativa</div></div>
      </div>
      <div class="summary-card">
        <div class="card-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></div>
        <div><div class="card-label">Tipos disponíveis</div><div class="card-value" style="font-size:14px">Despesa · Receita · Geral</div></div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h3>Gerenciar categorias</h3>
        <div class="table-actions">
          <button class="btn btn-danger" onclick="abrirModal('despesa')">+ Categoria de despesa</button>
          <button class="btn btn-primary" onclick="abrirModal('receita')">+ Categoria de receita</button>
          <button class="btn btn-info" onclick="abrirModal('geral')">+ Categoria geral</button>
        </div>
      </div>

      <div style="padding:12px 18px;border-bottom:1px solid #e2e8f0;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" id="filtro-todas" onclick="filtrar('todas')" style="background:#FF6400;color:#fff">Todas</button>
        <button class="btn btn-sm" id="filtro-despesa" onclick="filtrar('despesa')" style="background:#f0f0f0;color:#1a1a1a">Despesa</button>
        <button class="btn btn-sm" id="filtro-receita" onclick="filtrar('receita')" style="background:#f0f0f0;color:#1a1a1a">Receita</button>
        <button class="btn btn-sm" id="filtro-geral" onclick="filtrar('geral')" style="background:#f0f0f0;color:#1a1a1a">Geral</button>
      </div>

      <div style="padding:12px 18px 6px;font-size:13px;font-weight:600;color:#374151" id="label-filtro">Todas as categorias</div>

      <table style="table-layout:fixed">
        <colgroup>
          <col style="width:auto">
          <col style="width:200px">
          <col style="width:160px">
        </colgroup>
        <thead>
          <tr>
            <th>Nome</th>
            <th style="text-align:center">Tipo</th>
            <th style="text-align:right">Ações</th>
          </tr>
        </thead>
        <tbody id="tbody-cats">
          <tr class="empty-row"><td colspan="3">Nenhuma categoria encontrada.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" style="max-width:400px">
    <h2 id="modal-titulo">Nova categoria</h2>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Nome da categoria *</label>
      <input type="text" id="f-nome" placeholder="Ex: Alimentação">
    </div>
    <div class="form-group">
      <label>Tipo</label>
      <select id="f-tipo">
        <option value="despesa">Despesa</option>
        <option value="receita">Receita</option>
        <option value="geral">Geral</option>
      </select>
    </div>
    <div class="form-group">
      <label>Cor da categoria</label>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div id="cor-preview" style="width:32px;height:32px;border-radius:8px;background:#2563EB;border:2px solid #e2e8f0"></div>
        <span id="cor-hex" style="font-size:13px;color:#64748b">#2563EB</span>
      </div>
      <div class="color-swatches" id="swatches"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvar()">Salvar categoria</button>
    </div>
  </div>
</div>

<script src="/js/app.js?v=21"></script>
<script>
const CORES = ['#2563eb','#16a34a','#dc2626','#ea580c','#7c3aed','#db2777','#0891b2','#6b7280','#ca8a04','#0d9488','#9333ea','#64748b'];
let corSelecionada = '#2563eb';
let filtroAtivo = 'todas';

(async () => {
  const u = await checkAuth();
  if (!u) return;
  document.getElementById('sidebar-root').innerHTML = renderSidebar('/categorias');
  document.getElementById('topbar-root').innerHTML = renderTopbar();
  document.getElementById('bottom-nav-root').innerHTML = renderBottomNav('/categorias');
  renderUserBadge(u);
  renderSwatches();
  carregar();
})();

function renderSwatches(corAtual = '#2563eb') {
  const el = document.getElementById('swatches');
  el.innerHTML = CORES.map(c => `
    <div class="color-swatch ${c===corAtual?'selected':''}" style="background:${c}" onclick="selecionarCor('${c}')"></div>
  `).join('');
}

function selecionarCor(cor) {
  corSelecionada = cor;
  document.getElementById('cor-preview').style.background = cor;
  document.getElementById('cor-hex').textContent = cor;
  renderSwatches(cor);
}

async function carregar() {
  const lista = await apiFetch('/categorias') || [];
  document.getElementById('cv-total').textContent = lista.length;
  renderTabela(lista, filtroAtivo);
}

function renderTabela(lista, tipo) {
  const filtrada = tipo === 'todas' ? lista : lista.filter(c => c.tipo === tipo);
  const tipoLabel = { despesa: 'Despesa', receita: 'Receita', geral: 'Geral' };
  const tb = document.getElementById('tbody-cats');
  if (!filtrada.length) { tb.innerHTML = '<tr class="empty-row"><td colspan="3">Nenhuma categoria encontrada.</td></tr>'; return; }
  tb.innerHTML = filtrada.map(c => `
    <tr>
      <td style="display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap">
        <span style="width:12px;height:12px;border-radius:50%;background:${c.cor};display:inline-block;flex-shrink:0"></span>
        <span style="font-weight:500;overflow:hidden;text-overflow:ellipsis">${c.nome}</span>
      </td>
      <td style="text-align:center"><span class="badge ${c.tipo==='receita'?'badge-green':c.tipo==='despesa'?'badge-red':'badge-blue'}">${tipoLabel[c.tipo]}</span></td>
      <td class="td-actions" style="justify-content:flex-end;text-align:right;overflow:visible;white-space:nowrap">
        <button class="btn btn-info btn-sm" onclick="editar(${c.id})">Editar</button>
        <button class="btn btn-danger btn-sm" onclick="excluir(${c.id})">Excluir</button>
      </td>
    </tr>
  `).join('');
}

async function filtrar(tipo) {
  filtroAtivo = tipo;
  const labels = { todas:'Todas as categorias', despesa:'Categorias de despesa', receita:'Categorias de receita', geral:'Categorias gerais' };
  document.getElementById('label-filtro').textContent = labels[tipo];
  ['todas','despesa','receita','geral'].forEach(t => {
    const btn = document.getElementById(`filtro-${t}`);
    btn.style.background = t === tipo ? '#FF6400' : '#f0f0f0';
    btn.style.color = t === tipo ? '#fff' : '#1a1a1a';
  });
  const lista = await apiFetch('/categorias') || [];
  renderTabela(lista, tipo);
}

function abrirModal(tipoInicial = 'despesa', dados = null) {
  document.getElementById('modal-titulo').textContent = dados ? 'Editar categoria' : 'Nova categoria';
  document.getElementById('edit-id').value = dados?.id || '';
  document.getElementById('f-nome').value = dados?.nome || '';
  document.getElementById('f-tipo').value = dados?.tipo || tipoInicial;
  const cor = dados?.cor || '#2563eb';
  selecionarCor(cor);
  openModal('modal-overlay');
}
function fecharModal() { closeModal('modal-overlay'); }

async function salvar() {
  const id = document.getElementById('edit-id').value;
  const body = { nome: document.getElementById('f-nome').value.trim(), tipo: document.getElementById('f-tipo').value, cor: corSelecionada };
  if (!body.nome) { toast('Nome obrigatório.','error'); return; }
  try {
    if (id) await apiFetch(`/categorias/${id}`, { method:'PUT', body:JSON.stringify(body) });
    else await apiFetch('/categorias', { method:'POST', body:JSON.stringify(body) });
    toast(id ? 'Categoria atualizada!' : 'Categoria criada!');
    fecharModal();
    carregar();
  } catch(e) { toast(e.message,'error'); }
}

async function editar(id) {
  const lista = await apiFetch('/categorias') || [];
  const c = lista.find(x => x.id === id);
  if (c) abrirModal(c.tipo, c);
}

async function excluir(id) {
  const lista2 = await apiFetch('/categorias') || [];
  const item = lista2.find(x => x.id === id);
  confirmarExclusao(item?.nome || 'esta categoria', async () => {
    try { await apiFetch(`/categorias/${id}`, { method:'DELETE' }); toast('Categoria excluída!'); carregar(); }
    catch(e) { toast(e.message,'error'); }
  });
}
</script>
<div id="bottom-nav-root"></div>
</body>
</html>
