<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiqFy — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css?v=27">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.areceber-card {
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  border: 1px solid #bbf7d0;
  border-radius: 14px;
  padding: 0;
  margin-bottom: 20px;
  overflow: hidden;
}
.areceber-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid #bbf7d0;
}
.areceber-header h3 {
  font-size: 15px; font-weight: 700; color: #166534; margin: 0;
  display: flex; align-items: center; gap: 8px;
}
.areceber-total {
  font-size: 18px; font-weight: 800; color: #15803d;
}
.areceber-table { width: 100%; border-collapse: collapse; }
.areceber-table tr { border-bottom: 1px solid #dcfce7; }
.areceber-table tr:last-child { border-bottom: none; }
.areceber-table td { padding: 10px 20px; font-size: 13px; }
.areceber-table .desc { font-weight: 600; color: #1e293b; }
.areceber-table .sub { font-size: 11px; color: #64748b; margin-top: 2px; }
.areceber-table .val { text-align: right; color: #15803d; font-weight: 700; white-space: nowrap; }
.areceber-empty { padding: 28px 20px; text-align: center; color: #64748b; font-size: 13px; line-height: 1.8; }
.badge-cat-rec { display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:600; }
.areceber-row {
  cursor: pointer; transition: background 0.15s;
}
.areceber-row:hover td { background: #bbf7d050; }
.areceber-row:hover .desc { color: #15803d; }
.areceber-row .receber-hint {
  font-size: 10px; color: #22c55e; font-weight: 600;
  opacity: 0; transition: opacity 0.15s;
}
.areceber-row:hover .receber-hint { opacity: 1; }
.receber-info-dash {
  background: #f0fdf4; border-left: 3px solid #22c55e;
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
}
</style>
</head>
<body>
<div id="sidebar-root"></div>
<div class="main">
  <div id="topbar-root"></div>
  <div class="content">
    <div class="filter-bar">
      <label>Mês e ano</label>
      <select id="sel-mes" onchange="carregar()"></select>
      <select id="sel-ano" onchange="carregar()"></select>
    </div>

    <div class="summary-cards cols-5" id="cards-resumo">
      <div class="summary-card"><div class="card-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg></div><div><div class="card-label">Saldo atual</div><div class="card-value" id="cv-saldo">—</div></div></div>
      <div class="summary-card"><div class="card-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg></div><div><div class="card-label">Receitas</div><div class="card-value positive" id="cv-receitas">—</div></div></div>
      <div class="summary-card"><div class="card-icon red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg></div><div><div class="card-label">Despesas</div><div class="card-value negative" id="cv-despesas">—</div></div></div>
      <div class="summary-card"><div class="card-icon yellow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg></div><div><div class="card-label">Parcelas</div><div class="card-value" id="cv-parcelas">—</div></div></div>
      <div class="summary-card"><div class="card-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg></div><div><div class="card-label">Recorrências</div><div class="card-value" id="cv-recorrencias">—</div></div></div>
    </div>

    <!-- Seção A Receber -->
    <div id="section-areceber">
      <div class="areceber-card">
        <div class="areceber-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            A Receber
            <span id="areceber-qtd" style="background:#bbf7d0;color:#166534;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;display:none"></span>
          </h3>
          <div style="display:flex;align-items:center;gap:16px">
            <span class="areceber-total" id="areceber-total"></span>
            <a href="/receitas" style="font-size:12px;font-weight:600;color:#15803d;text-decoration:none;white-space:nowrap">Ver todas →</a>
          </div>
        </div>
        <table class="areceber-table">
          <tbody id="tbody-areceber">
            <tr><td colspan="2" class="areceber-empty">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="chart-card chart-full" style="margin-bottom:20px">
      <h3>Evolução Mensal — <span id="ano-chart"></span></h3>
      <div class="chart-container" style="height:240px"><canvas id="chart-evolucao"></canvas></div>
    </div>

    <div class="chart-grid">
      <div class="chart-card">
        <h3>Despesas por categoria</h3>
        <div class="chart-container" style="height:220px"><canvas id="chart-categorias"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Receitas x Despesas</h3>
        <div class="chart-container" style="height:220px"><canvas id="chart-doughnut"></canvas></div>
      </div>
    </div>

    <div class="chart-grid" style="margin-top:0">
      <div class="table-card">
        <div class="table-header"><h3>Próximas Contas</h3></div>
        <table>
          <tbody id="tbody-proximas"></tbody>
        </table>
      </div>
      <div class="table-card">
        <div class="table-header"><h3>Últimos Lançamentos</h3></div>
        <table>
          <tbody id="tbody-lancamentos"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Marcar Como Recebida -->
<div class="modal-overlay hidden" id="modal-receber">
  <div class="modal">
    <h2>Marcar Como Recebida</h2>
    <input type="hidden" id="receber-id">
    <div class="receber-info-dash">
      <div id="receber-descricao" style="font-weight:700;color:#0f172a;margin-bottom:4px;font-size:14px"></div>
      <div id="receber-valor" style="font-size:18px;color:#16a34a;font-weight:700"></div>
    </div>
    <div class="form-group">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px">Data de recebimento *</label>
      <input type="date" id="f-data-recebimento" style="width:100%;padding:9px 12px;border:1.5px solid #ebebeb;border-radius:8px;font-size:14px;font-family:inherit">
      <div style="font-size:11px;color:#94a3b8;margin-top:4px">Pode ser qualquer data — o valor soma no mês dessa data</div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModalReceber()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarRecebimento()">Confirmar Recebimento</button>
    </div>
  </div>
</div>

<script src="/js/app.js?v=21"></script>
<script>
let chartEvolucao, chartCat, chartDonut;
const _receitasMap = {};

(async () => {
  const u = await checkAuth();
  if (!u) return;
  document.getElementById('sidebar-root').innerHTML = renderSidebar('/dashboard');
  document.getElementById('topbar-root').innerHTML = renderTopbar();
  document.getElementById('bottom-nav-root').innerHTML = renderBottomNav('/dashboard');
  renderUserBadge(u);
  preencherFiltroMesAno('sel-mes', 'sel-ano', carregar);
})();

async function carregar() {
  const mes = document.getElementById('sel-mes').value;
  const ano = document.getElementById('sel-ano').value;
  document.getElementById('ano-chart').textContent = ano;
  try {
    const d = await apiFetch(`/dashboard?mes=${mes}&ano=${ano}`);
    if (!d) return;

    const saldo = d.saldo;
    document.getElementById('cv-saldo').textContent = fmtBRL(saldo);
    document.getElementById('cv-saldo').className = 'card-value ' + (saldo >= 0 ? 'positive' : 'negative');
    document.getElementById('cv-receitas').textContent = fmtBRL(d.receitas);
    document.getElementById('cv-despesas').textContent = fmtBRL(d.despesas);
    document.getElementById('cv-parcelas').textContent = d.parcelas;
    document.getElementById('cv-recorrencias').textContent = d.recorrencias;

    renderAReceber(d.aReceber || [], d.totalAReceber || 0);
    renderEvolucao(d.evolucao, d.evolucaoDespesas);
    renderCategorias(d.porCategoria);
    renderDonut(d.receitas, d.despesas);
    renderProximas(d.proximasContas);
    renderLancamentos(d.ultimosLancamentos);
  } catch(e) { toast(e.message, 'error'); }
}

function renderAReceber(lista, total) {
  const qtdEl = document.getElementById('areceber-qtd');
  const totalEl = document.getElementById('areceber-total');
  const tb = document.getElementById('tbody-areceber');

  if (!lista.length) {
    qtdEl.style.display = 'none';
    totalEl.textContent = '';
    tb.innerHTML = `
      <tr>
        <td colspan="2" class="areceber-empty">
          <span style="font-size:20px">✅</span><br>
          Nenhuma receita pendente a receber
        </td>
      </tr>`;
    return;
  }

  qtdEl.style.display = '';
  qtdEl.textContent = lista.length + (lista.length === 1 ? ' pendente' : ' pendentes');
  totalEl.textContent = fmtBRL(total);

  lista.forEach(r => { _receitasMap[r.id] = r; });

  tb.innerHTML = lista.map(r => {
    const catStyle = r.categoria_cor
      ? `background:${r.categoria_cor}22;color:${r.categoria_cor}`
      : 'background:#f3f4f6;color:#374151';
    const catLabel = r.categoria_nome
      ? `<span class="badge-cat-rec" style="${catStyle}">${r.categoria_nome}</span> `
      : '';
    const descSafe = String(r.descricao).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const dataFmt = r.data ? fmtDataCurta(String(r.data).substring(0, 10)) : '—';
    return `
      <tr class="areceber-row" onclick="abrirModalReceber(${r.id})" title="Clique para marcar como recebida">
        <td>
          <div class="desc">${catLabel}${descSafe} <span class="receber-hint">▶ Receber</span></div>
          <div class="sub">${dataFmt}</div>
        </td>
        <td class="val">${fmtBRL(r.valor)}</td>
      </tr>
    `;
  }).join('');
}

function abrirModalReceber(id) {
  const r = _receitasMap[id];
  if (!r) return;
  document.getElementById('receber-id').value = r.id;
  document.getElementById('receber-descricao').textContent = r.descricao;
  document.getElementById('receber-valor').textContent = fmtBRL(r.valor);
  document.getElementById('f-data-recebimento').value = new Date().toISOString().split('T')[0];
  openModal('modal-receber');
}

function fecharModalReceber() { closeModal('modal-receber'); }

async function confirmarRecebimento() {
  const id = document.getElementById('receber-id').value;
  const data_recebimento = document.getElementById('f-data-recebimento').value;
  if (!data_recebimento) { toast('Selecione a data de recebimento.', 'error'); return; }
  try {
    await apiFetch(`/receitas/${id}/receber`, {
      method: 'PUT',
      body: JSON.stringify({ data_recebimento })
    });
    toast('Receita marcada como recebida!');
    fecharModalReceber();
    carregar();
  } catch (e) { toast(e.message, 'error'); }
}

function renderEvolucao(rec, desp) {
  const labels = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const recArr = Array(12).fill(0);
  const despArr = Array(12).fill(0);
  rec.forEach(r => { recArr[parseInt(r.mes)-1] = r.total; });
  desp.forEach(r => { despArr[parseInt(r.mes)-1] = r.total; });
  if (chartEvolucao) chartEvolucao.destroy();
  chartEvolucao = new Chart(document.getElementById('chart-evolucao'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'Receitas', data: recArr, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', tension: 0.4, fill: true },
        { label: 'Despesas', data: despArr, borderColor: '#dc2626', backgroundColor: 'rgba(220,38,38,0.06)', tension: 0.4, fill: true }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true, ticks: { callback: v => 'R$' + v.toLocaleString('pt-BR') } } } }
  });
}

function renderCategorias(dados) {
  if (chartCat) chartCat.destroy();
  chartCat = new Chart(document.getElementById('chart-categorias'), {
    type: 'bar',
    data: {
      labels: dados.map(d => d.nome || 'Sem categoria'),
      datasets: [{ data: dados.map(d => d.total), backgroundColor: dados.map(d => d.cor || '#94a3b8') }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

function renderDonut(rec, desp) {
  if (chartDonut) chartDonut.destroy();
  chartDonut = new Chart(document.getElementById('chart-doughnut'), {
    type: 'doughnut',
    data: {
      labels: ['Receitas', 'Despesas'],
      datasets: [{ data: [rec, desp], backgroundColor: ['#22c55e', '#ef4444'], borderWidth: 0 }]
    },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, cutout: '65%' }
  });
}

function renderProximas(lista) {
  const tb = document.getElementById('tbody-proximas');
  if (!lista.length) { tb.innerHTML = '<tr><td style="text-align:center;color:#94a3b8;padding:20px">Nenhuma conta próxima</td></tr>'; return; }
  tb.innerHTML = lista.map(d => `
    <tr>
      <td><div style="font-weight:500">${d.descricao}</div><div style="font-size:12px;color:#64748b">${fmtDataCurta(d.vencimento)}</div></td>
      <td style="text-align:right;color:#dc2626;font-weight:600">${fmtBRL(d.valor)}</td>
    </tr>
  `).join('');
}

function renderLancamentos(lista) {
  const tb = document.getElementById('tbody-lancamentos');
  if (!lista.length) { tb.innerHTML = '<tr><td style="text-align:center;color:#94a3b8;padding:20px">Nenhum lançamento</td></tr>'; return; }
  tb.innerHTML = lista.map(d => `
    <tr>
      <td><div style="font-weight:500">${d.descricao}</div><div style="font-size:12px;color:#64748b">${fmtDataCurta(d.vencimento)}</div></td>
      <td style="text-align:right;color:#dc2626;font-weight:600">${fmtBRL(d.valor)}</td>
    </tr>
  `).join('');
}
</script>
<div id="bottom-nav-root"></div>
</body>
</html>
