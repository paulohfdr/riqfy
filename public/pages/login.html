<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/img/riqfy.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiqFy — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  color-scheme: dark;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  padding: clamp(16px, 4vw, 44px);
  background:
    radial-gradient(ellipse at 16% 90%, #31211b 0, transparent 44%),
    radial-gradient(ellipse at 85% 10%, #22272e 0, transparent 48%),
    #0d0f12;
  color: #f4f4f6;
  font: 400 16px/1.5 'Plus Jakarta Sans', sans-serif;
}
.login-card {
  margin: auto;
  display: grid;
  grid-template-columns: minmax(0, .86fr) minmax(0, 1fr);
  width: min(100%, 900px);
  overflow: hidden;
  background: linear-gradient(130deg, #23272d, #171a1f 68%);
  border: 1px solid #42454c;
  border-radius: 24px;
  box-shadow: 0 28px 80px #0006;
}
.brand {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  min-height: 454px;
  padding: 36px;
  border-right: 1px solid #434044;
  background-color: #18191d;
  background-image: radial-gradient(#64564a 1px, transparent 1px);
  background-size: 16px 16px;
}
.logo {
  display: block;
  position: relative;
  width: 110px;
  padding: 8px;
  border-radius: 12px;
  background: #18191d;
}
.ledger {
  margin: 26px 0 0; padding: 18px; border: 1px solid #49413b;
  border-top: 3px solid #ff853b; border-radius: 12px;
  background: #1c2026; box-shadow: 0 12px 32px #0005;
}
.ledger figcaption { font-size: 15px; font-weight: 700; color: #f6f1eb; }
.month { margin: 2px 0 12px; color: #c1b7af; font-size: 12px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px; font-variant-numeric: tabular-nums; }
.days small { color: #aeb3bc; font-size: 10px; }
.days span { position: relative; line-height: 28px; font-size: 12px; border-radius: 5px; }
.days .income, .days .expense { background: #282d34; }
.days .income::after, .days .expense::after, .key i::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--marker);
}
.days span::after { position: absolute; bottom: 2px; left: calc(50% - 2.5px); }
.income { --marker: #65dca1; } .expense { --marker: #ff8496; }
.key { display: flex; gap: 15px; padding-top: 12px; margin-top: 9px; border-top: 1px solid #353940; }
.key i { display: flex; align-items: center; gap: 5px; font-style: normal; font-size: 11px; color: #c6cbd1; }
.form-panel { align-self: center; padding: clamp(28px, 4vw, 52px); }
@media (max-width: 680px) {
  .login-card { grid-template-columns: 1fr; max-width: 440px; }
  .brand { min-height: 96px; padding: 16px 24px; border: 0; border-bottom: 1px solid #434044; }
  .logo { width: 96px; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ledger { margin: 0; padding: 8px 12px; }
  .ledger figcaption { font-size: 12px; }
  .ledger .month, .ledger .days { display: none; }
  .key { margin-top: 3px; padding: 0; border: 0; gap: 8px; }
  .logo { max-width: 26%; }
  .form-panel { padding: 28px 24px 32px; }
}
h1 { margin: 0 0 22px; font-size: clamp(24px, 5vw, 30px); line-height: 1.2; letter-spacing: -.035em; }
.field { margin-bottom: 18px; }
label { display: block; margin-bottom: 6px; color: #e4e6ea; font-size: 14px; font-weight: 600; }
input {
  display: block; width: 100%; min-height: 48px; padding: 10px 14px;
  border: 1px solid #606773; border-radius: 9px;
  background: #101216; color: #f5f5f6; font: inherit;
}
input::placeholder { color: #a4aab4; }
input:focus-visible, button:focus-visible { outline: 2px solid #ff934c; outline-offset: 3px; }
#orientacao { color: #d2d6dc; font-size: 14px; margin: -8px 0 22px; }
button {
  width: 100%; min-height: 48px; margin-top: 6px; padding: 10px 16px;
  border: 0; border-radius: 9px; background: #ff812d; color: #201208;
  font: inherit; font-weight: 800; cursor: pointer;
}
button::after { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 0 1px 10px; border: solid currentColor; border-width: 2px 2px 0 0; transform: rotate(45deg); }
button:hover { background: #ff9752; }
button:disabled { opacity: .75; cursor: wait; }
.error-msg {
  display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: 8px;
  background: #381f25; color: #ffd0d4; font-size: 14px;
}
</style>
</head>
<body>
<main class="login-card">
  <div class="brand">
    <img class="logo" src="/img/logo_riqfy_noturno.svg" alt="RiqFy">
    <figure class="ledger" role="img" aria-label="Ilustração do calendário financeiro com dias de receitas e despesas">
      <figcaption>Calendário financeiro</figcaption>
      <p class="month">Novembro · 2026</p>
      <div class="days" aria-hidden="true">
        <small>D</small><small>S</small><small>T</small><small>Q</small><small>Q</small><small>S</small><small>S</small>
        <span>1</span><span>2</span><span>3</span><span class="expense">4</span><span>5</span><span class="income">6</span><span>7</span>
        <span>8</span><span>9</span><span>10</span><span class="expense">11</span><span>12</span><span>13</span><span>14</span>
        <span>15</span><span>16</span><span class="expense">17</span><span>18</span><span>19</span><span class="income">20</span><span>21</span>
        <span>22</span><span>23</span><span class="expense">24</span><span>25</span><span>26</span><span>27</span><span>28</span>
        <span>29</span><span>30</span>
      </div>
      <div class="key"><i class="income">Receitas</i><i class="expense">Despesas</i></div>
    </figure>
  </div>
  <div class="form-panel">
  <h1 id="titulo">Entrar na sua conta</h1>
  <form id="acesso" aria-labelledby="titulo">
    <div class="error-msg" id="error-msg" role="alert"></div>
    <div id="credenciais">
      <div class="field">
        <label for="username">Usuário ou email</label>
        <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
    </div>
    <div id="primeiro-acesso" hidden>
      <p id="orientacao">Sua senha é provisória. Escolha uma senha diferente, com pelo menos 8 caracteres.</p>
      <div class="field">
        <label for="nova-senha">Nova senha</label>
        <input id="nova-senha" type="password" autocomplete="new-password" aria-describedby="orientacao">
      </div>
      <div class="field">
        <label for="confirmacao">Confirme a nova senha</label>
        <input id="confirmacao" type="password" autocomplete="new-password">
      </div>
    </div>
    <button type="submit" id="btn-login">Entrar</button>
  </form>
  </div>
</main>
<script>
document.getElementById('acesso').addEventListener('submit', event => {
  event.preventDefault();
  if (!document.getElementById('btn-login').disabled) fazerLogin();
});

async function fazerLogin() {
  const username = document.getElementById('username').value.trim();
  const senha    = document.getElementById('senha').value;
  const err      = document.getElementById('error-msg');
  const btn      = document.getElementById('btn-login');

  err.style.display = 'none';

  if (!username || !senha) { showError('Preencha usuário e senha.'); return; }

  const troca = !document.getElementById('primeiro-acesso').hidden;
  const novaSenha = document.getElementById('nova-senha').value;
  if (troca && novaSenha.length < 8) return showError('Use pelo menos 8 caracteres.');
  if (troca && novaSenha !== document.getElementById('confirmacao').value) return showError('As senhas precisam ser iguais.');
  btn.textContent = troca ? 'Salvando...' : 'Entrando...';
  btn.disabled = true;

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(troca ? { username, senha, novaSenha } : { username, senha })
    });
    const data = await r.json();
    if (!r.ok) {
      showError(data.erro || 'Usuário ou senha incorretos.');
      btn.textContent = troca ? 'Salvar e entrar' : 'Entrar';
      btn.disabled = false;
      return;
    }
    if (data.trocarSenha) {
      document.getElementById('credenciais').hidden = true;
      document.getElementById('primeiro-acesso').hidden = false;
      document.getElementById('titulo').textContent = 'Defina sua senha';
      document.title = 'RiqFy — Defina sua senha';
      btn.textContent = 'Salvar e entrar';
      btn.disabled = false;
      document.getElementById('nova-senha').focus();
      return;
    }
    window.location.href = '/dashboard';
  } catch {
    showError('Erro de conexão. Verifique se o servidor está rodando.');
    btn.textContent = troca ? 'Salvar e entrar' : 'Entrar';
    btn.disabled = false;
  }
}

function showError(msg) {
  const err = document.getElementById('error-msg');
  err.textContent = msg;
  err.style.display = 'block';
}

fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/dashboard'; });
</script>
</body>
</html>
