.scene { position: relative; isolation: isolate; width: min(100%, 416px); margin: auto; padding-top: 114px; }
.scene::before {
  content: ""; pointer-events: none; position: absolute; z-index: -1;
  inset: 32px -22% -6%; background: radial-gradient(ellipse 22% 13% at 50% 7%, #ffe7aeaa, transparent),
    radial-gradient(ellipse 47% 53% at 50% 28%, #ffa343aa, #f57b2a45 57%, transparent);
  mix-blend-mode: screen; animation: illuminate 1s ease-out both;
}
.lamp { position: absolute; top: 0; left: 50%; width: 102px; height: 46px; transform: translateX(-50%);
  border-radius: 5px 5px 2px 2px; background: linear-gradient(95deg,#151619,#3d3d3f 42%,#202124 88%);
  box-shadow: inset 0 1px 1px #ffffff45, 0 3px 8px #0009; }
.lamp::after { content: ""; position: absolute; inset: auto 4px -2px; height: 5px; border-radius: 50%;
  background: #ffe6ab; box-shadow: 0 2px 9px #ffbf76, 0 9px 24px #ff8b3b; animation: illuminate 1s ease-out both; }
.login-card {
  text-align: left; padding: clamp(24px, 5vw, 38px);
  border-radius: 18px; border: 1px solid #ffffff36; border-top-color: #ffe0ba85;
  background: linear-gradient(154deg, #513c31cb 0%, #222126da 40%, #17191de8 90%);
  backdrop-filter: blur(11px); -webkit-backdrop-filter: blur(11px);
  box-shadow: inset 0 1px 0 #fff2, 0 24px 64px #0008; animation: arrive .55s ease-out both;
}
.logo { display: block; width: 94px; margin: 0 auto 14px; }
h1 { text-align: center; margin: 0 0 25px; font-size: clamp(24px, 5vw, 29px); line-height: 1.22; letter-spacing: -.04em; }
@keyframes illuminate { from { opacity: .12; } to { opacity: 1; } }
@keyframes arrive { from { opacity: .45; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .scene::before, .lamp::after, .login-card { animation: none; } }
@media (max-width: 620px) { .scene::before { left: -12px; right: -12px; } }
@media (max-height: 660px) { .scene { padding-top: 80px; } .lamp { height: 32px; } }
.field { margin-bottom: 18px; }
label { display: block; margin-bottom: 6px; color: #e4e6ea; font-size: 14px; font-weight: 600; }
input {
  display: block; width: 100%; min-height: 48px; padding: 10px 18px;
  border: 1px solid #606773; border-radius: 24px;
  background: #17181cc9; color: #f5f5f6; font: inherit;
}
input::placeholder { color: #a4aab4; }
input:focus-visible, button:focus-visible { outline: 2px solid #ff934c; outline-offset: 3px; }
#orientacao { color: #d2d6dc; font-size: 14px; margin: -8px 0 22px; }
button {
  width: 100%; min-height: 48px; margin-top: 6px; padding: 10px 16px;
  border: 0; border-radius: 24px; background: #ff812d; color: #201208;
  font: inherit; font-weight: 800; cursor: pointer;
}
button::after { content: ""; display: inline-block; width: 7px; height: 7px; margin: 0 0 1px 10px; border: solid currentColor; border-width: 2px 2px 0 0; transform: rotate(45deg); }
button:hover { background: #ff9752; }
button:disabled { opacity: .75; cursor: wait; }
.error-msg {
  display: none; margin-bottom: 16px; padding: 10px 12px; border-radius: 8px;
  background: #381f25; color: #ffd0d4; font-size: 14px;
}
</style>
<link rel="stylesheet" href="/css/aparencia.css?v=1" media="screen">
<script src="/js/aparencia.js?v=1"></script>
</head>
<body>
<div class="tema-barra avulsa"><button type="button" class="tema-botao" aria-label="Ativar modo claro" title="Ativar modo claro">☀</button></div>
<div class="scene">
  <div class="lamp" aria-hidden="true"></div>
  <main class="login-card">
  <img class="logo" src="/img/logo_riqfy_noturno.svg" alt="RiqFy">
  <h1 id="titulo">Entrar na sua conta</h1>
  <form id="acesso" aria-labelledby="titulo">
    <div class="error-msg" id="error-msg" role="alert"></div>
    <div id="credenciais">
      <div class="field">
        <label for="username">Usuário ou email</label>
        <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required>
      </div>
    </div>
    <div id="primeiro-acesso" hidden>
      <p id="orientacao">Sua senha é provisória. Escolha uma senha diferente, com pelo menos 8 caracteres.</p>
      <div class="field">
        <label for="nova-senha">Nova senha</label>
        <input id="nova-senha" type="password" autocomplete="new-password" aria-describedby="orientacao">
      </div>
      <div class="field">
        <label for="confirmacao">Confirme a nova senha</label>
        <input id="confirmacao" type="password" autocomplete="new-password">
      </div>
    </div>
    <button type="submit" id="btn-login">Entrar</button>
  </form>
  </main>
</div>
<script>
document.getElementById('acesso').addEventListener('submit', event => {
  event.preventDefault();
  if (!document.getElementById('btn-login').disabled) fazerLogin();
});

async function fazerLogin() {
  const username = document.getElementById('username').value.trim();
  const senha    = document.getElementById('senha').value;
  const err      = document.getElementById('error-msg');
  const btn      = document.getElementById('btn-login');

  err.style.display = 'none';

  if (!username || !senha) { showError('Preencha usuário e senha.'); return; }

  const troca = !document.getElementById('primeiro-acesso').hidden;
  const novaSenha = document.getElementById('nova-senha').value;
  if (troca && novaSenha.length < 8) return showError('Use pelo menos 8 caracteres.');
  if (troca && novaSenha !== document.getElementById('confirmacao').value) return showError('As senhas precisam ser iguais.');
  btn.textContent = troca ? 'Salvando...' : 'Entrando...';
  btn.disabled = true;

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(troca ? { username, senha, novaSenha } : { username, senha })
    });
    const data = await r.json();
    if (!r.ok) {
      showError(data.erro || 'Usuário ou senha incorretos.');
      btn.textContent = troca ? 'Salvar e entrar' : 'Entrar';
      btn.disabled = false;
      return;
    }
    if (data.trocarSenha) {
      document.getElementById('credenciais').hidden = true;
      document.getElementById('primeiro-acesso').hidden = false;
      document.getElementById('titulo').textContent = 'Defina sua senha';
      document.title = 'RiqFy — Defina sua senha';
      btn.textContent = 'Salvar e entrar';
      btn.disabled = false;
      document.getElementById('nova-senha').focus();
      return;
    }
    window.location.href = '/dashboard';
  } catch {
    showError('Erro de conexão. Verifique se o servidor está rodando.');
    btn.textContent = troca ? 'Salvar e entrar' : 'Entrar';
    btn.disabled = false;
  }
}

function showError(msg) {
  const err = document.getElementById('error-msg');
  err.textContent = msg;
  err.style.display = 'block';
}

fetch('/api/auth/me').then(r => { if (r.ok) window.location.href = '/dashboard'; });
</script>
</body>
</html>
